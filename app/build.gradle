plugins {
    id 'com.android.application'
}

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.xarchive.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xarchive.app'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '1.0.1'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    // The web app lives in /docs (also served by GitHub Pages); package it as the APK's assets.
    sourceSets {
        main {
            assets.srcDirs += [rootProject.file('docs')]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
