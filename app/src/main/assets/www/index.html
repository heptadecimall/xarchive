<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="XArchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>window.XA_MODE='pwa';</script>
<title>XArchive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style id="css">
:root{--ink:#0d0d0d;--paper:#f4f2ee;--g1:#d9d6d0;--g2:#9a978f;--g3:#4a4844;--b:3px solid var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 64px}
/* header */
header{border-bottom:var(--b);background:var(--paper);position:sticky;top:0;z-index:5}
.hd{max-width:1200px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.mark{display:flex;align-items:center;gap:3px}
.mark b,.mark i{display:flex;align-items:center;justify-content:center;width:26px;height:26px;font-family:'Archivo Black';font-style:normal;font-size:17px;line-height:1}
.mark b{background:var(--ink);color:var(--paper)}
.mark i{border-radius:50%;background:var(--g2);color:var(--paper);width:22px;height:22px;font-size:16px}
.wbtn{border-left:2px solid var(--g1);align-self:stretch;width:48px;font-weight:700;font-size:15px}
.wbtn:hover{background:var(--ink);color:var(--paper)}
.wadd{font-family:Archivo;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;border:2px solid var(--ink);padding:5px 10px;background:var(--ink);color:var(--paper)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.paste{border:2px dashed var(--ink);background:#fff;padding:8px 10px;font-size:13px;min-height:38px;outline:none;color:var(--g3)}
.paste:focus{border-style:solid;color:var(--ink)}
.danger{width:100%;border:var(--b);padding:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;background:var(--paper)}
.wordmark{font-family:'Archivo Black';font-size:24px;letter-spacing:-.5px;line-height:1}
.hd .sp{flex:1}
.hbtn{border:var(--b);padding:7px 12px;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;background:var(--paper)}
.hbtn:active{background:var(--ink);color:var(--paper)}
.bk textarea{width:100%;min-height:110px;border:var(--b);background:#fff;padding:10px;font-family:ui-monospace,monospace;font-size:12px;outline:none}
.bk .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.count{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--g3)}
/* hero band */
.band{display:grid;grid-template-columns:1fr auto;border:var(--b);margin:20px 0 0;background:var(--ink);color:var(--paper)}
.band h1{font-family:'Archivo Black';font-size:clamp(28px,7vw,64px);line-height:.92;padding:18px;text-transform:uppercase;letter-spacing:-1px}
.band .geo{width:clamp(80px,18vw,180px);border-left:var(--b);border-color:var(--paper);position:relative;overflow:hidden;background:var(--paper)}
.band .geo .c{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:var(--ink);left:-20%;top:10%}
.band .geo .s{position:absolute;width:45%;aspect-ratio:1;background:var(--g2);right:10%;bottom:10%}
.band .geo .l{position:absolute;height:6px;width:100%;background:var(--ink);top:62%}
/* toolbar */
.tools{display:flex;gap:0;margin-top:16px;border:var(--b);background:#fff}
.tools input{flex:1;min-width:0;border:none;outline:none;padding:12px 14px;font-size:16px;background:transparent}
.btn{border-left:var(--b);padding:0 16px;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;background:var(--paper)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn:active{transform:translateY(1px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:2px solid var(--ink);padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--paper)}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.ghost{border-style:dashed;color:var(--g3)}
/* grid */
.sec{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin:28px 0 12px;border-bottom:var(--b);padding-bottom:6px}
.sec h2{font-family:'Archivo Black';font-size:18px;text-transform:uppercase;letter-spacing:.5px}
.sec span{background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;letter-spacing:1px;padding:3px 8px;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px}
.card{border:var(--b);background:#fff;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;min-width:0}
.card:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ink)}
.thumb{aspect-ratio:3/4;width:100%;background:var(--g1);border-bottom:var(--b);overflow:hidden;position:relative;flex:none}
.thumb img,.lt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1)}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ph .big{font-family:'Archivo Black';font-size:64px;color:var(--paper);mix-blend-mode:normal;position:relative;z-index:1}
.ph .c{position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:var(--ink)}
.ph .s{position:absolute;width:34%;aspect-ratio:1;background:var(--g2);right:8%;bottom:8%}
.num{position:absolute;top:0;left:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:11px;letter-spacing:1px;padding:4px 7px;z-index:2}
.go{position:absolute;top:8px;right:8px;width:34px;height:34px;background:var(--paper);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;text-decoration:none;z-index:2;font-size:16px}
.go svg{width:16px;height:16px;display:block}
svg.ar{width:.95em;height:.95em;display:inline-block;vertical-align:-.1em;flex:none}
.go:hover{background:var(--ink);color:var(--paper)}
.cname{margin:10px 10px 4px;font-family:'Archivo Black';font-size:15px;text-transform:uppercase;line-height:1.1;word-break:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:2.2em;flex:none}
.cols3 .cname{font-size:12px;margin:8px 7px 3px}
.cols3 .ccat{padding:0 7px 8px;font-size:9px;letter-spacing:.5px}
.cols4 .cname{font-size:10px;margin:6px 5px 2px;letter-spacing:0}
.cols4 .ccat{padding:0 5px 6px;font-size:8px;letter-spacing:.3px}
.cols3 .go,.cols4 .go{width:26px;height:26px;top:5px;right:5px}
.cols3 .go svg,.cols4 .go svg{width:13px;height:13px}
.cols4 .num{font-size:9px;padding:3px 5px}
.cols3 .ph .big{font-size:44px}.cols4 .ph .big{font-size:32px}
/* list view */
.list{display:flex;flex-direction:column;gap:8px}
.lr{display:grid;grid-template-columns:57px minmax(0,1fr) auto;align-items:center;border:var(--b);background:#fff;cursor:pointer;height:82px}
.lt{position:relative;overflow:hidden;background:var(--g1);border-right:var(--b);height:100%}
.lt .ph .big{font-size:26px}
.lx{padding:0 12px;min-width:0}
.lx .cname{margin:0 0 4px;height:auto;display:block;white-space:nowrap;text-overflow:ellipsis;-webkit-line-clamp:unset}
.lx .ccat{padding:0}
.lr .go{position:static;margin-right:12px}
body.nogray .thumb img,body.nogray .lt img,body.nogray .imgprev img{filter:none}
/* filter chips "more" */
.chip.more{border-style:dashed;display:inline-flex;align-items:center;gap:6px}
.chip.more.has:after{content:'';width:7px;height:7px;background:var(--ink);border-radius:50%}
/* header icon button */
.ibtn{border:var(--b);width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.ibtn svg{width:22px;height:22px}
.ibtn:active{background:var(--ink);color:var(--paper)}
/* settings */
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:var(--b);background:#fff}
.seg button{padding:10px 0 8px;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:6px}
.seg button + button{border-left:2px solid var(--ink)}
.seg button svg{width:22px;height:22px}
.seg button.on{background:var(--ink);color:var(--paper)}
.srow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border:var(--b);background:#fff;padding:12px 14px;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;text-align:left}
.srow + .srow{margin-top:8px}
.srow small{display:block;font-size:11px;letter-spacing:1px;color:var(--g3);margin-top:3px;text-transform:none;font-weight:500}
.srow > svg{width:18px;height:18px;flex:none}
.tg{width:48px;height:28px;border:2px solid var(--ink);position:relative;background:var(--paper);flex:none}
.tg:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--ink);transition:left .15s}
.tg.on{background:var(--ink)}
.tg.on:after{left:23px;background:var(--paper)}
.ccat{padding:0 10px 10px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--g3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:var(--b);border-style:dashed;padding:48px 20px;text-align:center}
.empty h3{font-family:'Archivo Black';text-transform:uppercase;font-size:22px;margin-bottom:8px}
.empty p{color:var(--g3);margin-bottom:16px}
.cta{display:inline-block;border:var(--b);background:var(--ink);color:var(--paper);padding:12px 20px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px}
/* detail */
.back{margin-top:20px;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;border:var(--b);padding:8px 14px;background:var(--paper);display:inline-flex;align-items:center;gap:8px}
.det{display:block;border:var(--b);margin-top:16px;background:#fff;max-width:760px}
@media (max-width:720px){.det{grid-template-columns:1fr}}
.det .img{border-right:var(--b);background:var(--g1);position:relative;aspect-ratio:3/4}
@media (max-width:720px){.det .img{border-right:none;border-bottom:var(--b);max-height:70vh}}
.det .img img{width:100%;height:100%;object-fit:cover;display:block}
.info{display:flex;flex-direction:column}
.info .top{padding:18px;border-bottom:var(--b)}
.info .idx{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--g3)}
.info h1{font-family:'Archivo Black';font-size:clamp(30px,6vw,54px);line-height:.95;text-transform:uppercase;margin:6px 0 12px;word-break:break-word}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 8px;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr;border-bottom:var(--b)}
.row > *{padding:14px 18px;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.row > *:first-child{border-right:var(--b);background:var(--ink);color:var(--paper)}
.row.three{grid-template-columns:2fr 1fr 1fr}
.row.three > *:nth-child(2){border-right:var(--b)}
.note{padding:18px;border-bottom:var(--b);white-space:pre-wrap;line-height:1.5}
.note:empty{display:none}
.lbl{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--g3);margin-bottom:6px;display:block}
.works{padding:0}
.det.works{margin-top:20px}
.works h3{font-family:'Archivo Black';text-transform:uppercase;padding:12px 12px 12px 18px;border-bottom:var(--b);display:flex;justify-content:space-between;align-items:center;font-size:16px;line-height:1}
.works h3 .wt{font-family:'Archivo Black';font-size:16px;letter-spacing:.5px;color:var(--ink)}
.wadd{display:inline-flex;align-items:center;line-height:1}
.wbtn{display:flex;align-items:center;justify-content:center}
.wbtn svg{width:18px;height:18px}
.info .top{border-bottom:var(--b)}
.info > :last-child{border-bottom:none}
.works h3 span{font-family:Archivo;font-weight:700;font-size:12px;letter-spacing:2px;color:var(--g3)}
.work{display:grid;grid-template-columns:44px 1fr 48px;border-bottom:2px solid var(--g1);align-items:center;text-decoration:none}
.work:last-child{border-bottom:none}
.work .n{font-weight:700;font-size:12px;color:var(--g2);text-align:center;letter-spacing:1px}
.work .t{padding:12px 8px 12px 0;font-weight:700;word-break:break-word;text-decoration:none;display:block}
.work a.t svg.ar{margin-left:6px}
a.t:hover{text-decoration:underline}
.work .a{text-align:center;font-weight:700}
.nowork{padding:18px;color:var(--g3)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(13,13,13,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.modal{background:var(--paper);border:var(--b);border-bottom:none;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1);padding-bottom:0px}
.mb{overflow-y:auto;flex:1}
.grab{height:18px;display:flex;justify-content:center;align-items:center;background:var(--ink)}
.grab:before{content:'';width:44px;height:4px;background:var(--g2)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:var(--b);background:#fff;padding:6px 8px;cursor:text}
.tagbox .chips{margin:0;gap:6px}
.tagbox .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px}
.tagbox .chip button{color:var(--paper);font-weight:700;width:20px;height:20px;line-height:1}
.tagbox input{flex:1;min-width:120px;border:none;outline:none;padding:6px 2px;font-size:16px;background:transparent}
.field .tagbox input#ti,.field .tagbox input#ti:focus{border:none;box-shadow:none;width:auto;padding:6px 2px;background:transparent}
.sugg{border:var(--b);border-top:none;background:#fff}
.sugg:empty{display:none}
.sugg .opt{display:block;width:100%;text-align:left;padding:10px 12px;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:1px;border-top:2px solid var(--g1)}
.sugg .opt:first-child{border-top:none}
.sugg .opt.hi,.sugg .opt:hover{background:var(--ink);color:var(--paper)}
.sugg .none{padding:10px 12px;font-size:13px;color:var(--g3)}

.mh{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--paper);padding:12px 16px}
.mh h2{font-family:'Archivo Black';text-transform:uppercase;font-size:18px}
.mh button{color:var(--paper);font-size:22px;font-weight:700;width:32px;height:32px}
.mb{padding:16px;display:flex;flex-direction:column;gap:16px}
.field input[type=text],.field input[type=url],.field textarea{width:100%;border:var(--b);background:#fff;padding:10px 12px;font-size:16px;outline:none}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field textarea:focus{box-shadow:4px 4px 0 var(--ink)}
.imgpick{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:stretch}
.imgprev{aspect-ratio:3/4;border:var(--b);background:var(--g1);overflow:hidden;position:relative}
.imgprev img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.imgbtns{display:flex;flex-direction:column;gap:8px;justify-content:center}
.sbtn{border:var(--b);padding:10px 12px;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;background:var(--paper);text-align:center;display:block}
.sbtn.dark{background:var(--ink);color:var(--paper)}
.hint{font-size:12px;color:var(--g3);line-height:1.4}
.wrow{display:grid;grid-template-columns:1fr 1fr 40px;gap:0;border:var(--b);background:#fff;margin-bottom:8px}
.wrow input{border:none;outline:none;padding:10px;font-size:15px;min-width:0;background:transparent}
.wrow input:first-child{border-right:2px solid var(--ink)}
.wrow button{border-left:2px solid var(--ink);font-weight:700;font-size:18px}
@media (max-width:480px){.wrow{grid-template-columns:1fr 40px}.wrow input:first-child{border-right:none;border-bottom:2px solid var(--ink);grid-column:1}.wrow input:nth-child(2){grid-column:1}.wrow button{grid-row:1/3;grid-column:2}}
.addcat{display:flex;border:2px solid var(--ink);background:#fff;margin-top:8px}
.addcat input{flex:1;border:none;outline:none;padding:8px 10px;font-size:15px;min-width:0}
.addcat button{border-left:2px solid var(--ink);padding:0 12px;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;background:var(--ink);color:var(--paper)}
.mf{display:flex;border-top:var(--b)}
.mf button{flex:1;padding:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px}
.mf button + button{border-left:var(--b)}
.mf .pri{background:var(--ink);color:var(--paper)}
.catline{display:grid;grid-template-columns:1fr auto 40px;border:var(--b);background:#fff;margin-bottom:8px;align-items:center}
.catline input{border:none;outline:none;padding:10px;font-size:15px;font-weight:700;text-transform:uppercase;min-width:0;background:transparent}
.catline .ct{font-size:11px;font-weight:700;color:var(--g3);padding:0 10px;letter-spacing:1px}
.catline button{border-left:2px solid var(--ink);height:100%;font-weight:700;font-size:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;z-index:30;border:2px solid var(--paper)}
.notice{margin-top:14px;border:2px dashed var(--ink);padding:10px 12px;font-size:13px;color:var(--g3)}
.err{color:#000;font-weight:700;font-size:13px;background:var(--g1);padding:8px 10px;border-left:6px solid var(--ink)}
header{padding-top:0px}
.wrap{padding-bottom:calc(64px + 0px)}
.toast{bottom:calc(18px + 0px)}
/* touch: no blue tap flash, no text selection on long-press, real press states */
*{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
a{-webkit-touch-callout:none}
button:focus,a:focus{outline:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (hover:none){
  .card:hover{transform:none;box-shadow:none}
  .go:hover{background:var(--paper);color:var(--ink)}
  .wbtn:hover{background:none;color:inherit}
  a.t:hover{text-decoration:none}
  .sugg .opt:hover{background:none;color:inherit}
}
.card,.lr{transition:transform .12s,box-shadow .12s,opacity .12s}
.card:active,.lr:active{transform:scale(.97)}
.chip,.btn,.sbtn,.srow,.cta,.back,.ibtn,.mf button,.seg button,.wadd,.go,.wbtn,.row > *,.danger,.addcat button,.catline button,.mh button,.pad button,.work a.t{transition:background-color .12s,color .12s,transform .1s}
.chip:active,.btn:active,.sbtn:active,.srow:active,.cta:active,.back:active,.ibtn:active,.mf button:active,.seg button:active,.go:active,.wbtn:active,.row > :not(span):active,.danger:active,.addcat button:active,.catline button:active{background:var(--ink);color:var(--paper);transform:scale(.97)}
.wadd:active,.row > *:first-child:active,.btn.dark:active,.sbtn.dark:active,.mf .pri:active,.chip.on:active,.cta:active,.seg button.on:active{background:var(--g3);color:var(--paper)}
.mh button:active{opacity:.6}
.work a.t:active{opacity:.55}
/* page transitions */
@keyframes pgIn{from{opacity:0;transform:translateY(14px)}}
@keyframes itIn{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes downOut{to{transform:translateY(100%)}}
#app.enter > *{animation:pgIn .32s cubic-bezier(.2,.8,.2,1) both}
#app.enter > :nth-child(2){animation-delay:.04s}
#app.enter > :nth-child(3){animation-delay:.08s}
#app.enter > :nth-child(n+4){animation-delay:.12s}
#app.enter .grid > *,#app.enter .list > *{animation:itIn .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.14s + var(--i,0) * 35ms)}
.ov.out{animation:fadeOut .2s forwards}

let saveTimer=null;
function save(msg){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  render();
  if(PWA){IDB.set('state',S).then(()=>toast(msg||'Saved'),()=>toast('Could not save — storage full?'));return;}
  if(!artifact){toast(msg||'Saved on this device');return;}
  toast('Saving…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await artifact.publish(buildDoc());}
    catch(e){const c=e&&(e.code||e.message)||'';
      if(/conflict/i.test(c))toast('Updated elsewhere — reloading');
      else toast('Could not save online — kept on this device');}
  },400);
}

function toast(t){
  let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}
  el.textContent=t;clearTimeout(el._t);el._t=setTimeout(()=>el.remove(),2200);

function thumb(a,i){
  if(a.image)return '<img src="'+esc(a.image)+'" alt="">';

}

function idxOf(a){return S.artists.indexOf(a)+1;}

function filtered(){
  const q=filter.q.trim().toLowerCase();
  return S.artists.filter(a=>{
    if(q&&!((a.name||'').toLowerCase().includes(q)||(a.works||[]).some(w=>(w.title||'').toLowerCase().includes(q))))return false;
    if(filter.cats.length&&!filter.cats.some(c=>(a.tags||[]).includes(c)))return false;
    if(!rateOk(a.rating,filter.rating||0))return false;
    return true;
  }).sort((x,y)=>{
    const byName=(x.name||'').localeCompare(y.name||'');
    if(filter.sort==='rating')return (+y.rating||0)-(+x.rating||0)||byName;
    if(filter.sort==='recent')return S.artists.indexOf(y)-S.artists.indexOf(x);
    return byName;});
}

let lastView=null,enterT=null,rateT=null;

}

// Show at most MAX_CHIP_ROWS rows of filter chips; the last slot becomes "+N more".
function layoutChips(){
  const box=$('#fchips'),more=box&&box.querySelector('[data-more]');if(!more)return;
  const items=[...box.querySelectorAll('.chip:not([data-more])')];
  items.forEach(x=>x.style.display='');more.style.display='none';
  const tops=[...new Set(items.map(x=>x.offsetTop))].sort((a,b)=>a-b);
  if(tops.length<=MAX_CHIP_ROWS){more.classList.remove('has');return;}
  more.style.display='';
  if(chipsOpen){more.textContent='Less';more.classList.remove('has');return;}
  const limit=tops[MAX_CHIP_ROWS-1];
  items.forEach(x=>{if(x.offsetTop>limit)x.style.display='none';});
  more.textContent='+ More';
  let vis=items.filter(x=>x.style.display!=='none');
  while(more.offsetTop>limit&&vis.length>1){vis.pop().style.display='none';}
  const hidden=items.filter(x=>x.style.display==='none');
  more.textContent='+'+hidden.length+' more';
  more.classList.toggle('has',hidden.some(x=>x.classList.contains('on')));
}

let closeTop=null;
function modal(title,body,foot){
  $('#layer').innerHTML='<div class="ov"><div class="modal"><div class="grab"></div><div class="mh"><h2>'+esc(title)+'</h2><button id="mx" aria-label="Close">×</button></div><div class="mb">'+body+'</div>'+(foot||'')+'</div></div>';
  const ov=$('#layer .ov');
  const close=()=>{if(closeTop===close)closeTop=null;if(!ov.isConnected)return;
    ov.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));ov.classList.add('out');setTimeout(()=>ov.remove(),200);};
  closeTop=close;
  $('#mx').onclick=close;
  ov.onclick=e=>{if(e.target===ov)close();};
  return close;
}

  $('#cn').onclick=close;$('#ok').onclick=()=>{close();ok();};
}

// resize image to keep things light
function resize(file,max){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('resize')),'image/jpeg',0.85);
    };img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});

// ---- image picker (shared by the artist forms) ----
function loadsOk(url){return new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=url;setTimeout(()=>r(false),8000);});}
async function toImage(file){
  let small=null;
  try{small=await resize(file,700);}catch(e){}
  if(assets){
    try{const r=await assets.upload(small||file);const u=r.url||('/_blob/'+r.id);if(await loadsOk(u))return u;}catch(e){}
  }
  if(small)return await blobToData(small);
  if(file.size<1500000)return await blobToData(file);
  throw new Error('This image format could not be read. Try a JPG or PNG.');
}

    '<button class="sbtn dark" id="fpick">Choose image</button><input type="file" accept="image/*" id="ff" class="vh">'+
    '<div class="paste" id="fpaste" contenteditable="true">…or tap here &amp; paste an image</div>'+
    '<button class="sbtn" id="frm">Remove</button></div></div><div id="ierr"></div></div>';

function wireImage(d,getName){
  const draw=()=>{$('#ip').innerHTML=d.image?'<img src="'+esc(d.image)+'" alt="">':thumb({name:getName()});$('#frm').style.display=d.image?'':'none';};
  const use=async f=>{
    $('#ierr').innerHTML='';$('#ip').innerHTML='<div class="ph"><span class="hint">Loading…</span></div>';
    try{d.image=await toImage(f);}catch(err){$('#ierr').innerHTML='<div class="err">'+esc(err.message||'Could not use that image.')+'</div>';}
    draw();
  };
  $('#fpick').onclick=e=>{e.preventDefault();$('#ff').click();};
  $('#ff').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)use(f);e.target.value='';};
  const p=$('#fpaste');
  p.onpaste=e=>{e.preventDefault();const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.type.startsWith('image/'));
    if(it)use(it.getAsFile());else $('#ierr').innerHTML='<div class="err">No image on the clipboard — copy an image first.</div>';p.blur();};
  p.oninput=()=>{p.textContent='…or tap here & paste an image';};
  $('#frm').onclick=e=>{e.preventDefault();d.image='';draw();};
  draw();return draw;
}
function catField(){return '<div class="field"><label class="lbl">Tags</label><div class="tagbox" id="tb"><div class="chips" id="fc"></div><input id="ti" type="text" autocomplete="off" placeholder="Type to find a tag…"></div><div class="sugg" id="ts"></div><span class="hint">New tags are created in the Tags menu.</span></div>';}
function wireCats(d){
  const inp=$('#ti'),box=$('#ts');
  const draw=()=>{$('#fc').innerHTML=d.tags.map(c=>'<span class="chip on">'+esc(c)+' <button data-c="'+esc(c)+'" aria-label="Remove">×</button></span>').join('');
    $('#fc').querySelectorAll('[data-c]').forEach(b=>b.onclick=e=>{e.preventDefault();d.tags=d.tags.filter(x=>x!==b.dataset.c);draw();sug();});};
  const sug=()=>{
    const q=inp.value.trim().toLowerCase();
    if(document.activeElement!==inp&&!q){box.innerHTML='';return;}
    const opts=S.tags.filter(t=>!d.tags.includes(t)&&t.toLowerCase().includes(q)).slice(0,8);
    box.innerHTML=opts.length?opts.map((t,k)=>'<button class="opt'+(k===0?' hi':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>').join('')
      :(S.tags.length&&!q?'<div class="none">All tags added</div>':'<div class="none">No matching tag — add it in Tags first</div>');
    box.querySelectorAll('[data-t]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=e=>{e.preventDefault();pick(b.dataset.t);};});
  };
  const pick=t=>{if(!d.tags.includes(t))d.tags.push(t);inp.value='';draw();sug();inp.focus();};
  inp.oninput=sug;inp.onfocus=sug;inp.onblur=()=>setTimeout(()=>{if(document.activeElement!==inp)box.innerHTML='';},150);
  inp.onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();const h=box.querySelector('.opt.hi')||box.querySelector('.opt');if(h)pick(h.dataset.t);}
    else if(e.key==='Backspace'&&!inp.value&&d.tags.length){d.tags.pop();draw();sug();}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const o=[...box.querySelectorAll('.opt')];if(!o.length)return;let k=o.findIndex(x=>x.classList.contains('hi'));o.forEach(x=>x.classList.remove('hi'));k=(k+(e.key==='ArrowDown'?1:-1)+o.length)%o.length;o[k].classList.add('hi');}
  };
  $('#tb').onclick=e=>{if(e.target.id==='tb'||e.target.id==='fc')inp.focus();};
  draw();
}

async function exportData(){
  const out=JSON.parse(JSON.stringify(S));
  for(const a of out.artists){
    if(a.image&&!a.image.startsWith('data:')){
      try{const b=await (await fetch(a.image)).blob();a.image=await blobToData(b);}catch(e){a.image='';}
    }
  }
  return JSON.stringify(out);
}

// ---- PIN lock ----
const LK='xarchive-lock';
const BKSP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="transform:translateX(-1px)"><path d="M8.5 5H22v14H8.5L2 12z"/><path d="M12.75 9.25l5.5 5.5M18.25 9.25l-5.5 5.5"/></svg>';
function getLock(){try{return JSON.parse(localStorage.getItem(LK)||'null');}catch(e){return null;}}
async function hashPin(salt,pin){
  const d=new TextEncoder().encode(salt+':'+pin);
  if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  let x=0;for(const b of d)x=(x*31+b)>>>0;return 'f'+x.toString(16);
}

function pinPad(o){
  const el=document.createElement('div');el.className='lock';
  el.innerHTML='<div class="lk-top"><span class="mark"><b>X</b></span><h2 class="lkt"></h2><p class="lks"></p><div class="dots"><i></i><i></i><i></i><i></i></div></div>'+
    '<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join('')+
    (o.cancel?'<button class="tx" data-k="c">Cancel</button>':'<span></span>')+'<button data-k="0">0</button><button class="tx" data-k="b" aria-label="Delete">'+BKSP+'</button></div>';
  document.body.appendChild(el);
  const t=el.querySelector('.lkt'),sb=el.querySelector('.lks'),dots=el.querySelector('.dots');
  t.textContent=o.title;sb.textContent=o.sub||'';
  let v='',busy=false;
  const upd=()=>dots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i<v.length));
  const close=()=>{document.removeEventListener('keydown',kd);el.classList.add('out');setTimeout(()=>el.remove(),220);};
  const shake=()=>{dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');if(navigator.vibrate)navigator.vibrate(60);};
  const press=async k=>{
    if(busy)return;
    if(k==='c'){close();o.onCancel&&o.onCancel();return;}
    if(k==='b'){v=v.slice(0,-1);upd();return;}
    if(v.length>=4)return;
    v+=k;upd();
    if(v.length<4)return;
    busy=true;await new Promise(r=>setTimeout(r,120));
    const r=await o.check(v);
    v='';upd();busy=false;
    if(r===true){close();return;}
    if(r&&typeof r==='object'){t.textContent=r.title||t.textContent;sb.textContent=r.sub||'';if(r.shake)shake();return;}
    sb.textContent=o.wrong||'Wrong PIN';shake();
  };
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  const kd=e=>{if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('b');else if(e.key==='Escape'&&o.cancel)press('c');};
  document.addEventListener('keydown',kd);
  el._cancel=o.cancel?()=>press('c'):null;
  return close;
}
function lockNow(){
  const L=getLock();if(!L||document.querySelector('.lock'))return;
  pinPad({title:'Enter PIN',sub:'XArchive is locked',check:async p=>(await hashPin(L.salt,p))===L.hash});
}
function setNewPin(done){
  let first=null;
  pinPad({title:'New PIN',sub:'Choose 4 digits',cancel:true,check:async p=>{
    if(first===null){first=p;return {title:'Confirm PIN',sub:'Enter it again'};}
    if(p!==first){first=null;return {title:'New PIN',sub:'PINs did not match — try again',shake:true};}
    const salt=uid()+uid();localStorage.setItem(LK,JSON.stringify({salt,hash:await hashPin(salt,p)}));
    done&&done(true);return true;}});
}
function verifyPin(title,ok){
  const L=getLock();if(!L)return ok();
  pinPad({title:title,sub:'Enter current PIN',cancel:true,check:async p=>{if((await hashPin(L.salt,p))!==L.hash)return false;setTimeout(ok,240);return true;}});
}
// lock again when coming back after a minute in the background
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>60000)lockNow();});

// Android back button: close the top sheet / dialog, otherwise ask to quit.
window.xaBack=function(){
  const lk=document.querySelector('.lock:not(.out)');
  if(lk){if(lk._cancel){lk._cancel();return true;}return false;}
  if(closeTop){closeTop();return true;}
  if(!window.XArchiveNative)return false;
  confirmBox('Exit XArchive?','Close the app?',()=>XArchiveNative.exitApp(),'Exit');
  return true;
};

function openCats(){
  const count=c=>S.artists.filter(a=>(a.tags||[]).includes(c)).length;
  const draft=S.tags.map(c=>({old:c,name:c}));
  const close=modal('Tags','<div id="cl"></div><div class="addcat" style="margin-top:0"><input id="cn2" type="text" placeholder="New tag"><button id="cb2">Add</button></div><span class="hint">Deleting a tag removes it from every artist.</span>',
    '<div class="mf"><button id="cc">Cancel</button><button class="pri" id="cs">Save</button></div>');
  const sync=()=>document.querySelectorAll('#cl .catline input').forEach((inp,i)=>draft[i].name=inp.value);
  const draw=()=>{$('#cl').innerHTML=draft.map((c,i)=>'<div class="catline"><input value="'+esc(c.name)+'"><span class="ct">'+(c.old?count(c.old):0)+'</span><button data-i="'+i+'">×</button></div>').join('')||'<p class="hint">No tags.</p>';
    $('#cl').querySelectorAll('button').forEach(b=>b.onclick=()=>{sync();draft.splice(+b.dataset.i,1);draw();});};
  draw();
  const add=()=>{sync();const v=$('#cn2').value.trim();if(v&&!draft.some(c=>c.name.toLowerCase()===v.toLowerCase()))draft.push({old:null,name:v});$('#cn2').value='';draw();};
  $('#cb2').onclick=add;$('#cn2').onkeydown=e=>{if(e.key==='Enter')add();};
  $('#cc').onclick=close;
  $('#cs').onclick=()=>{
    sync();
    const seen=new Set(),keep=[];
    draft.forEach(c=>{c.name=c.name.trim();if(c.name&&!seen.has(c.name.toLowerCase())){seen.add(c.name.toLowerCase());keep.push(c);}});
    const map={};keep.forEach(c=>{if(c.old)map[c.old]=c.name;});
    S.artists.forEach(a=>{a.tags=[...new Set((a.tags||[]).filter(c=>c in map).map(c=>map[c]))];});
    S.tags=keep.map(c=>c.name);
    filter.cats=filter.cats.filter(c=>c in map).map(c=>map[c]);
    close();save('Tags saved');
  };
}

$('#home').onclick=()=>{filter={q:'',cats:[],rating:0,sort:'name'};location.hash='';render();};
window.addEventListener('hashchange',render);
$('#menu').onclick=openSettings;
applyPrefs();
lockNow();
render();

if(PWA){(async()=>{try{const v=await IDB.get('state');if(v){S=mig(v);render();}if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){toast('Storage unavailable');}})();}
else (async()=>{
  try{if(window.claude&&claude.use){
    const [ar,as]=await Promise.all([claude.use('artifact'),claude.use('assets')]);
    artifact=ar;assets=as;render();
  }}catch(e){}
})();
})();
